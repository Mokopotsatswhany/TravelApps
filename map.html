<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesotho VR Travel Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #08111f;
      color: white;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 70px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      color: #5eead4;
    }

    .logo span {
      color: white;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #5eead4;
    }

    .hero-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .hero-text {
      max-width: 900px;
    }

    .hero-text h1 {
      font-size: 70px;
      line-height: 1.1;
      margin-bottom: 25px;
      font-weight: 800;
    }

    .hero-text p {
      font-size: 20px;
      color: #d8d8d8;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 16px 34px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      display: inline-block;
      border: 0;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-primary {
      background: #14b8a6;
      color: white;
    }

    .btn-primary:hover {
      background: #0f9487;
      transform: translateY(-3px);
    }

    .btn-secondary {
      border: 2px solid white;
      color: white;
    }

    .btn-secondary:hover {
      background: white;
      color: black;
    }

    @media(max-width: 900px) {
      nav {
        padding: 20px 25px;
        flex-direction: column;
        gap: 15px;
      }

      .hero-text h1 {
        font-size: 45px;
      }

      .hero-text p {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>

  <header class="hero">
    <nav>
      <div class="logo">Lesotho <span>VR Travel</span></div>
      <div class="nav-links">
        <a href="#home">Home</a>
      </div>
    </nav>

    <div class="hero-content" id="home">
      <div class="hero-text">
        <h1>Explore Lesotho in Virtual Reality</h1>
        <p>
          Experience famous landmarks around Lesotho inside a realistic 3D VR environment.
          Visit mountains, waterfalls, villages, and heritage sites while learning historical
          facts through immersive guided tours and narration.
        </p>
        <div class="hero-buttons">
          <a href="index.html" class="btn btn-primary">Start Exploring</a>
          <button type="button" class="btn btn-secondary" id="guided-tour-button">Listen Guided Tours</button>
        </div>
      </div>
    </div>
  </header>

  <audio id="guided-tour-audio" src="sehlaba.mp3" preload="auto"></audio>
  <script>
    const guidedTourButton = document.querySelector("#guided-tour-button");
    const guidedTourAudio = document.querySelector("#guided-tour-audio");

    guidedTourButton.addEventListener("click", () => {
      if (guidedTourAudio.paused) {
        guidedTourAudio.play();
        guidedTourButton.textContent = "Pause Guided Tour";
      } else {
        guidedTourAudio.pause();
        guidedTourButton.textContent = "Listen Guided Tours";
      }
    });

    guidedTourAudio.addEventListener("ended", () => {
      guidedTourButton.textContent = "Listen Guided Tours";
    });
  </script>
</body>
</html>
